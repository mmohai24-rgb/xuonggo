function anhHong(im){var t=im.getAttribute('data-tg');var v=anhTG(t);if(t&&v&&im.src!==v){im.src=v;return;}

function napAnhTG(){
  if(IO_ANH)IO_ANH.disconnect();
  if('IntersectionObserver' in window&&!IO_ANH)IO_ANH=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;IO_ANH.unobserve(e.target);
    var t=e.target.getAttribute('data-tg');if(!t||e.target.getAttribute('src'))return;var v=anhTG(t);if(v)e.target.src=v;else HANG_ANH[t]=1;});henNapAnh();},{rootMargin:'400px 0px'});
  q('img[data-tg]').forEach(function(im){var t=im.getAttribute('data-tg');if(!t||im.getAttribute('src'))return;var v=anhTG(t);if(v){im.src=v;return;}
    if(IO_ANH)IO_ANH.observe(im);else HANG_ANH[t]=1;});
  henNapAnh();}
function henNapAnh(){clearTimeout(HEN_ANH);HEN_ANH=setTimeout(guiNapAnh,120);}

function thangHienTai(){var n=new Date();return (n.getMonth()<9?'0':'')+(n.getMonth()+1)+'/'+n.getFullYear();}
function khoaThang(t){var p=String(t||'').split('/');return p.length===2?p[1]+p[0]:'0';}
function veThang(){var s=SX;var o=[];
  var theo={};s.ds.forEach(function(d){var k=d.thang||'chưa rõ';(theo[k]=theo[k]||[]).push(d);});
  var ds=Object.keys(theo).sort(function(a,b){return khoaThang(b)>khoaThang(a)?1:-1;});

  o.push('<h2>Số đơn mỗi tháng</h2><div class="o" style="overflow-x:auto"><table class="tk"><tr><th>Tháng</th><th class="so">Đơn</th><th class="so">Xong</th><th class="so">Đang</th><th class="so">Ngưng</th><th class="so">Lỗi</th><th class="so">TB ngày</th></tr>');
  ds.forEach(function(k){var x=theo[k];var xong=x.filter(function(d){return d.cd==='Hoàn thành';});var ngung=x.filter(function(d){return d.cd==='Tạm ngưng'||d.cd==='Huỷ';});
    var loi=(s.loi||[]).filter(function(l){return x.some(function(d){return d.ma===l.ma;});}).length;
    var co=xong.filter(function(d){return d.tongNgay!==''&&d.tongNgay!==null;});var tb=co.length?Math.round(co.reduce(function(a,d){return a+Number(d.tongNgay);},0)/co.length*10)/10:'—';
    o.push('<tr style="cursor:pointer'+(k===locThang?';font-weight:700':'')+'" data-thang="'+esc(k)+'"><td>'+(k===locThang?'▸ ':'')+esc(k)+'</td><td class="so"><b>'+x.length+'</b></td><td class="so">'+xong.length+'</td><td class="so">'+(x.length-xong.length-ngung.length)+'</td><td class="so">'+ngung.length+'</td><td class="so"'+(loi?' style="color:var(--do)"':'')+'>'+loi+'</td><td class="so">'+tb+'</td></tr>');});
  o.push('</table></div>');
  o.push('<div style="margin-top:10px">');ds.forEach(function(k){o.push('<span class="chip'+(k===locThang?' chon':'')+'" data-thang="'+esc(k)+'">'+esc(k)+' ('+theo[k].length+')</span>');});o.push('</div>');

function loi(e){document.getElementById('than').innerHTML='<div class="trong">Không tải được dữ liệu.<br>'+esc(e&&e.message)+'</div>';}
// ===== 02/10 TĂNG TỐC: hiện ngay dữ liệu gắn sẵn trong trang, tải bản mới thành hai nửa song song, tự làm mới khi trang đang mở =====
var PHAN_A=null,PHAN_B=null,DANG_CU=false,LUC_DL=0,DANG_TAI=0,TAI_LAI=false,CHU_KY='',LAN_VE=0,LAN_TAI=0,T_GUI=0,MS_MC=0,MS_TONG=0;
function gopDL(){var d={},k;for(k in PHAN_A)d[k]=PHAN_A[k];if(PHAN_B&&PHAN_A&&PHAN_A.quyen==='quanly')for(k in PHAN_B)d[k]=PHAN_B[k];return d;}
function chuKy(d){try{return JSON.stringify(d,function(k,v){if(k==='capNhat'||k==='msMayChu')return undefined;if(typeof v==='number'&&v%1!==0)return Math.round(v*10)/10;return v;});}catch(e){return String(Date.now());}}
function giay(ms){return (Math.round(ms/100)/10).toLocaleString('vi-VN')+'s';}
function dongCapNhat(){var e=document.getElementById('capnhat');if(!e||!PHAN_A||!PHAN_A.donHang)return;
  var t=DANG_CU?'⏳ Đang lấy dữ liệu mới… (đang xem bản lúc '+new Date(LUC_DL).toTimeString().slice(0,5)+')':'Cập nhật '+PHAN_A.donHang.capNhat;
  if(!DANG_CU&&QUYEN==='quanly'&&MS_TONG)t+=' · tải '+giay(MS_TONG)+(MS_MC?' (máy chủ '+giay(MS_MC)+')':'');
  e.textContent=t;e.style.color=DANG_CU?'var(--cam)':'';}
function veNeuDoi(epVe){if(!PHAN_A)return;var d=gopDL();var ky=chuKy(d);
  if(!epVe&&DL&&ky===CHU_KY&&Date.now()-LAN_VE<600000){dongCapNhat();return;}
  if(!epVe&&DL&&document.getElementById('lop')){dongCapNhat();return;}   // đang mở hộp thoại: để yên, lần sau vẽ
  CHU_KY=ky;LAN_VE=Date.now();ve(d);dongCapNhat();}
// 03/10: trang GitHub — lưu bản dữ liệu mới nhất trên máy để lần mở sau hiện ngay (trang trong Google đã có DL_SAN do máy chủ gắn)
function khoaMay(){var h=0,t=String(KHOA||'');for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return 'xg_dl:'+h;}
function luuDLMay(){if(!window.XG_NGOAI||!PHAN_A)return;try{localStorage.setItem(khoaMay(),JSON.stringify({a:PHAN_A,b:PHAN_B,luc:LUC_DL}));}catch(e){try{localStorage.removeItem(khoaMay());}catch(e2){}}}
function docDLMay(){if(!window.XG_NGOAI)return null;try{var v=localStorage.getItem(khoaMay());if(!v)return null;var o=JSON.parse(v);return o&&o.a?{a:o.a,b:o.b||null,cu:true,luc:o.luc||0}:null;}catch(e){return null;}}
if(typeof DL_SAN==='undefined'||!DL_SAN){var DL_SAN=null;}
function tai(nen){if(DANG_TAI){if(!nen)TAI_LAI=true;return;}
  DANG_TAI=2;TAI_LAI=false;T_GUI=Date.now();var A=null,B=null,mc=0,loiA=null;
  function xong(){if(--DANG_TAI>0)return;LAN_TAI=Date.now();
    if(A){var cu=DANG_CU;PHAN_A=A;if(B)PHAN_B=B;DANG_CU=false;LUC_DL=Date.now();MS_MC=mc;MS_TONG=Date.now()-T_GUI;veNeuDoi(!nen||cu);luuDLMay();}
    else if(!DL)loi(loiA);else{DANG_CU=false;dongCapNhat();if(!nen)bao('Không tải được dữ liệu mới: '+((loiA&&loiA.message)||''),1);}
    if(TAI_LAI)tai();}
  google.script.run.withSuccessHandler(function(k){A=k;mc=Math.max(mc,(k&&k.msMayChu)||0);xong();}).withFailureHandler(function(e){loiA=e;xong();}).layTatCa(KHOA,'a');
  google.script.run.withSuccessHandler(function(k){B=k&&Object.keys(k).length?k:null;mc=Math.max(mc,(k&&k.msMayChu)||0);xong();}).withFailureHandler(function(){xong();}).layTatCa(KHOA,'b');}
document.getElementById('lammoi').onclick=function(){document.getElementById('capnhat').textContent='Đang tải…';tai();};
// 04/10: chỉ bắt đầu tải khi đã đăng nhập (trang GitHub) — 05_dang_nhap.js gọi batDau() sau khi đăng nhập xong
var DA_BAT_DAU=false;
function batDau(){if(DA_BAT_DAU)return;DA_BAT_DAU=true;
  if(!DL_SAN)DL_SAN=docDLMay();
  // mở trang: có dữ liệu gắn sẵn thì vẽ ngay
  if(typeof DL_SAN!=='undefined'&&DL_SAN&&DL_SAN.a){PHAN_A=DL_SAN.a;PHAN_B=DL_SAN.b||null;DANG_CU=!!DL_SAN.cu;LUC_DL=DL_SAN.luc||Date.now();
    MS_MC=DL_SAN.cu?0:(DL_SAN.a.msMayChu||0);MS_TONG=MS_MC;veNeuDoi(true);if(DANG_CU)tai(true);else LAN_TAI=Date.now();}
  else tai();
  // tự làm mới mỗi phút — chỉ khi trang đang hiện trên màn hình (khoá máy / chuyển ứng dụng thì nghỉ)
  setInterval(function(){if(document.hidden)return;if(Date.now()-LAN_TAI<55000)return;tai(true);},15000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-LAN_TAI>60000)tai(true);});
}
if(KHOA)batDau();else moDangNhap();
